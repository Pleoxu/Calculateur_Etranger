name: calculateur_etranger
description: Calculateur de tir (refactor)
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2
  flutter_riverpod: ^2.6.1

  # Chiffrement AES-256-GCM
  cryptography: ^2.9.0

  # Stockage sécurisé
  flutter_secure_storage: ^10.3.1

  file_picker: ^11.0.2
  shared_preferences: ^2.2.2
  path: ^1.9.0
  file_selector: ^1.0.4
  archive: ^4.0.9

  # Cartographie
  flutter_map: ^7.0.2
  flutter_map_mbtiles: ^1.0.4
  mbtiles: ^0.4.2
  latlong2: ^0.9.1

  # Position / GPS
  geolocator: ^14.0.2
  flutter_blue_plus: ^2.3.4
  flutter_libserialport: ^0.6.0

  http: ^1.2.0
  path_provider: ^2.1.5
  proj4dart: any
  pdf: ^3.13.0
  sqlite3: ^2.9.4
  image: ^4.9.2
  path_provider_foundation: 2.5.1
  mobile_scanner: ^7.4.1
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

